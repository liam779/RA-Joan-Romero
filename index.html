<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taller AR - TEL 315 | UCB</title>

  <!-- Bibliotecas estables: A-Frame 1.3.0 y AR.js 3.4.5 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .badge {
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .badge span {
      color: #38bdf8;
    }

    .hud-bottom {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    #estado-marcador {
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    #btn-escala {
      pointer-events: auto;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    #btn-escala:active {
      transform: scale(0.96);
      background: #0369a1;
    }
  </style>
</head>

<body>
  <div class="hud-top">
    <div class="badge">Estudiante: <span>JOAN HENRY ROMERO HUANCA</span> | TEL 315</div>
    <div class="badge">Tamaño: <span id="estado-tamano">Normal</span></div>
  </div>

  <div class="hud-bottom">
    <div id="estado-marcador">Apunta a Hiro o Kanji</div>
    <button id="btn-escala" type="button">Cambiar tamaño</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true; antialias: false; precision: medium;"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; detectionMode: mono; trackingMethod: best; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;"
  >
    <!-- Tarjeta A: Marcador HIRO -> Foto (sube el archivo junto a index.html) -->
    <a-marker
      preset="hiro"
      id="marcador-a"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >
      <a-entity id="contenedor-foto" scale="1 1 1">
        <a-plane
          id="objeto-foto"
          src="400438c0-29eb-4203-ae28-e6085f343269.png"
          position="0 0.5 0"
          rotation="-90 0 0"
          width="1.2"
          height="1.2"
        ></a-plane>
      </a-entity>
    </a-marker>

    <!-- Tarjeta B: Marcador KANJI -> Esfera Roja -->
    <a-marker
      preset="kanji"
      id="marcador-b"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >
      <a-entity id="contenedor-esfera" scale="1 1 1">
        <a-sphere
          id="objeto-esfera"
          position="0 0.5 0"
          radius="0.5"
          color="#dc2626"
        ></a-sphere>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const btnEscala = document.getElementById('btn-escala');
    const etiquetaEstado = document.getElementById('estado-tamano');
    const estadoMarcador = document.getElementById('estado-marcador');
    const contenedorFoto = document.getElementById('contenedor-foto');
    const contenedorEsfera = document.getElementById('contenedor-esfera');
    const marcadorA = document.getElementById('marcador-a');
    const marcadorB = document.getElementById('marcador-b');

    let esAmpliado = false;

    btnEscala.addEventListener('click', () => {
      esAmpliado = !esAmpliado;
      const factor = esAmpliado ? '1.5 1.5 1.5' : '1 1 1';
      contenedorFoto.setAttribute('scale', factor);
      contenedorEsfera.setAttribute('scale', factor);
      etiquetaEstado.textContent = esAmpliado ? 'Ampliado' : 'Normal';
    });

    marcadorA.addEventListener('markerFound', () => {
      estadoMarcador.textContent = 'Detectado: HIRO (Foto)';
    });
    marcadorA.addEventListener('markerLost', () => {
      estadoMarcador.textContent = 'Apunta a Hiro o Kanji';
    });

    marcadorB.addEventListener('markerFound', () => {
      estadoMarcador.textContent = 'Detectado: KANJI (Esfera Roja)';
    });
    marcadorB.addEventListener('markerLost', () => {
      estadoMarcador.textContent = 'Apunta a Hiro o Kanji';
    });
  </script>
</body>
</html>
